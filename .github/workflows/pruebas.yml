# Corre las pruebas de la app en cada push y en cada pull request. Si alguna falla, GitHub lo marca
# con una cruz roja en el cambio. No publica nada ni usa claves.
name: Pruebas

on:
  push:
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Correr las pruebas
        run: npm test
