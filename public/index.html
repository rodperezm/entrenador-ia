<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- viewport-fit=cover entrega los márgenes del iPhone (notch y barra de gestos) a la app. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>
    <!-- Ícono y modo "app" al agregarla a la pantalla de inicio (GitHub Pages sirve bajo /entrenador-ia). -->
    <link rel="apple-touch-icon" href="/entrenador-ia/apple-touch-icon.png" />
    <link rel="manifest" href="/entrenador-ia/manifest.json" />
    <meta name="theme-color" content="#0E0F13" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="KettleIA" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <script>
      // Si falla un archivo de la app (página guardada de otra versión), recarga una vez por minuto.
      window.addEventListener(
        'error',
        function (e) {
          var s = e.target;
          if (!s || s.tagName !== 'SCRIPT' || s.src.indexOf('/_expo/static/') < 0) return;
          try {
            var last = Number(sessionStorage.getItem('chunk-reload') || 0);
            if (Date.now() - last < 60000) return;
            sessionStorage.setItem('chunk-reload', String(Date.now()));
          } catch (_) {
            return;
          }
          location.reload();
        },
        true,
      );
    </script>
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
        background-color: #0e0f13;
      }
      /* These styles make the root element full-height */
      /* Instalada en iPhone, height: 100% no llega al borde: el alto se toma de la pantalla.
         El margen de arriba se aplica aquí; el de abajo, en WebSafeArea, para que cada barra
         llegue al borde con su color. */
      #root {
        display: flex;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 100vh;
        height: 100dvh;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top);
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript> You need to enable JavaScript to run this app. </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
